name: PineTS Runtime Verify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-pinets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Prepare fixed PineTS runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          cd runtime
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund pinets@0.9.29
          node -e "const p=require('./node_modules/pinets/package.json'); if(p.version!=='0.9.29') throw new Error('Unexpected version '+p.version); console.log(p.version)" > PINETS_VERSION.txt
          sha256sum node_modules/pinets/dist/pinets.min.cjs > PINETS_SHA256.txt
          tar -czf pinets-0.9.29-runtime.tgz node_modules/pinets package.json package-lock.json PINETS_VERSION.txt PINETS_SHA256.txt
      - name: Upload PineTS runtime
        uses: actions/upload-artifact@v4
        with:
          name: pinets-0.9.29-runtime
          path: runtime/pinets-0.9.29-runtime.tgz
          if-no-files-found: error
          retention-days: 1
